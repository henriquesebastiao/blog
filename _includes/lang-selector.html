<link
  rel="stylesheet"
  href="{{ '/assets/css/lang-selector.css' | relative_url }}"
/>

<div class="lang-selector-wrapper">
  <div class="btn-group dropup lang-dropdown-group w-100">
    <button
      type="button"
      class="lang-toggle-btn"
      id="lang-toggle"
      data-bs-toggle="dropdown"
      aria-label="Switch Language"
    >
      <i class="fa-solid fa-language lang-toggle-icon"></i>
      <span class="lang-toggle-label">
        {% case site.active_lang %} {% when 'pt-BR' %}Português {% when 'en'
        %}English {% else %}{{ site.active_lang }} {% endcase %}
      </span>
      <i class="fa-solid fa-chevron-down lang-toggle-chevron"></i>
    </button>
    <ul class="dropdown-menu rounded-3 mb-1 p-1 w-100">
      {%- for lang in site.languages -%}
      <li>
        <button
          class="dropdown-item d-flex align-items-center{% if lang == site.active_lang %} active{% endif %}"
          type="button"
          data-lang-url="{% if lang == site.default_lang %}{{ page.url }}{% else %}/{{ lang }}{{ page.url }}{% endif %}"
        >
          {% case lang %} {% when 'pt-BR' %}Português {% when 'en' %}English {%
          else %}{{ lang }} {% endcase %}
        </button>
      </li>
      {%- endfor -%}
    </ul>
  </div>
</div>

<script>
  document
    .querySelectorAll("#lang-toggle + .dropdown-menu [data-lang-url]")
    .forEach(function (btn) {
      btn.addEventListener("click", function () {
        window.location.href = this.dataset.langUrl;
      });
    });
</script>
